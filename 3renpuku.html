<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>てきちゅーる</title>
    <style>
* { box-sizing: border-box; }

body { 
    font-family: "Helvetica Neue", Arial, sans-serif; 
    background: #fff;
    margin: 0;
    padding: 5px 5px 100px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* 10.0倍以下のオッズを赤色に */
.odds-red {
    color: #d32f2f !important;
    font-weight: bold;
}

/* 馬データ一覧テーブル整形 10.0倍以下のオッズを赤太字 */

.horse-detail {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 13px;
}

.horse-detail th,
.horse-detail td {
    border: 1px solid #ccc;
    padding: 6px 8px;
    text-align: left;
}

.odds-red {
    color: red;
    font-weight: bold;
}

/* 縦（水色） */
.logic-tate {
    color: #0288d1;          /* 濃い水色 */
    font-weight: bold;
    background: #e1f5fe;     /* 薄い水色背景 */
    padding: 1px 4px;
    border-radius: 3px;
}

/* 裏（赤） */
.logic-ura {
    color: #d32f2f;          /* 赤 */
    font-weight: bold;
    background: #ffebee;     /* 薄い赤背景 */
    padding: 1px 4px;
    border-radius: 3px;
}

/* 2人気◯番目（緑） */
.logic-fav2 {
    color: #2e7d32;          /* 緑 */
    font-weight: bold;
    background: #e8f5e9;     /* 薄い緑背景 */
    padding: 1px 4px;
    border-radius: 3px;
}

/* ★ ここを固定幅 → 可変幅に変更 */
.main-wrapper { 
    width: 100%;
    max-width: 1200px;
    padding-bottom: 50px;
}

/* Table Header の文字サイズをオッズと同じに統一 */
.w-tbl th,
.occ-tbl th,
.main-table th {
    font-size: 11px !important;
}

/* 入力エリア */
.input-section { 
    display: flex;
    flex-wrap: wrap; /* ★ スマホで折り返し */
    gap: 10px; 
    margin-bottom: 10px;
    background: #f4f4f4;
    padding: 10px;
    border-radius: 4px;
}
.input-box { flex: 1; min-width: 250px; }

/* テキストエリア */
textarea { 
    width: 100%; 
    height: 80px; 
    border: 1px solid #ccc; 
    font-size: 11px; 
    padding: 5px; 
    resize: none; 
}

/* ボタン */
.button-group { 
    display: flex; 
    flex-wrap: wrap; /* ★ スマホ対応 */
    justify-content: center; 
    gap: 20px; 
    margin-bottom: 15px; 
}

/* セクションヘッダ */
.section-header { 
    background: #334455; 
    color: #fff; 
    padding: 4px 10px; 
    font-size: 11px; 
    font-weight: bold; 
    margin-top: 10px; 
}

/* テーブル全体をスクロール可能にする（スマホ対応） */
.table-container { 
    width: 100%; 
    overflow-x: auto; /* ★ 横スクロール許可 */
    border: 1px solid #999; 
    margin-bottom: 15px; 
    background: #fff; 
}

/* テーブル */
table.main-table { 
    border-collapse: collapse; 
    width: 100%; 
    table-layout: fixed; /* ★ セル幅均等化 */
}

th.label-col { 
    width: 35px; 
    background: #667788; 
    color: #fff; 
    font-size: 10px; 
    text-align: center; 
    border-right: 2px solid #333; 
}

td { 
    border: 1px solid #ccc; 
    text-align: left; 
    padding: 2px 2px; 
    font-size: 11px; 
    font-weight: bold; 
    white-space: nowrap; 
}

/* 枠連・3連複テーブルの横並びレイアウト */
#outW, #outS {
    display: flex;
    flex-wrap: nowrap;    /* ← 折り返し禁止 */
    gap: 10px;
    overflow-x: auto;     /* ← 横スクロール許可 */
    padding-bottom: 5px;
    padding-left: 15px;  /* ← ★ 左側に余白を追加 */
}

/* 枠連・馬単テーブルの組番列を広くする */
.w-tbl td:nth-child(2),
.w-tbl th:nth-child(2) {
    width: 40px;       /* ← 好きな幅に調整可能（60〜80推奨） */
    min-width: 40px;
}

#bottom-odds-area {
    width: 100%;
    max-width: 1200px;
    margin: 40px auto 0 auto;
    padding-bottom: 50px;
}

.raw-odds {
    width: 100%;
    height: 140px;
    margin-bottom: 25px;
    font-size: 12px;
    white-space: pre;
}

.race-info-box {
    background: #f5f5f5;
    border-left: 4px solid #1976d2;
    padding: 12px 15px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 1.6;
}

.race-posttime {
    color: red;
    font-weight: bold;
}

.race-refresh {
    color: #0288d1; /* 濃い水色 */
    font-weight: bold;
}

/* 買い目条件エリア */
.hidden {
    display: none;
}

.condition-row {
    margin-bottom: 8px;
    font-size: 14px;
}

.condition-row label {
    margin-right: 15px;
}

/* 買い目枠連人気 ハイライト表示 */
.highlight-cell {
    background-color: #ffeb3b !important;
    font-weight: bold;
}

.waku-cell {
    background: #fffde7;
}

/* ★ 目に優しいマイルドな黄色に変更 */
.highlight-cell {
    background: #fff59d !important; /* パステル調の優しい黄色 */
    color: #333333 !important;       /* 文字のコントラストを保ち、読みやすく */
}

/* スマホ向け調整 */
@media (max-width: 900px) {
    .main-wrapper {
        padding: 0 5px;
    }
    table.main-table {
        font-size: 10px;
    }
    td, th {
        padding: 2px;
    }
}
    </style>
</head>
<body>

<!-- 買い目抽出 結果の表示エリア -->
        <div id="buyResultArea" class="hidden">

    <!-- ★ 最下部：生オッズ表示（updateOdds で取得したテキスト） -->
    <div id="bottom-odds-area">

        <div class="section-header">取得した生オッズ（枠連）</div>

            <textarea id="inW" class="raw-odds"></textarea>
        </div>

        <div class="section-header">取得した生オッズ（単複）</div>
        <div class="textarea-container">
            <textarea id="inT" class="raw-odds"></textarea>
        </div>

        <!-- ▼ 馬単（inU）から3連複（inS）に変更 -->
        <div class="section-header">取得した生オッズ（3連複）</div>
        <div class="textarea-container">

</div>
<script>
// ============================================
// ★ 枠連1人気の買い目抽出（3連複対応版）
// ============================================
const WAKU1_CONFIG = {
    minWaku1Odds: 3.0,     // 枠連1人気オッズ下限
    maxWaku1Odds: 8.2,     // 枠連1人気オッズ上限
    minWaku2Odds: 4.8,     // 枠連2人気オッズ下限
    maxWaku2Odds: 8.9      // 枠連2人気オッズ上限（※馬単設定は削除・変更）
};

function extractWaku1Buy(wakuren, umatan, tanfuku) {
    const cfg = WAKU1_CONFIG;

    // 枠連データの確認（1人気・2人気の両方が必要）
    const wr1 = wakuren[0]; // 枠連1人気
    const wr2 = wakuren[1]; // 枠連2人気
    if (!wr1 || !wr2) return "";

    const w1Odds = Number(wr1.odds);
    const w2Odds = Number(wr2.odds);

    // ①-1 枠連1人気のオッズチェック (3.0 - 8.2)
    if (w1Odds < cfg.minWaku1Odds || w1Odds > cfg.maxWaku1Odds) return "";

    // ①-2 枠連2人気のオッズチェック (4.8 - 8.9)
    if (w2Odds < cfg.minWaku2Odds || w2Odds > cfg.maxWaku2Odds) return "";

    // 枠連1人気に対応する枠・馬番リスト作成
    const pair = wr1.pair;
    const [wakuA, wakuB] = pair.split("-").map(Number);
    const listA = tanfuku.filter(h => Number(h.waku) === wakuA).map(h => Number(h.num));
    const listB = tanfuku.filter(h => Number(h.waku) === wakuB).map(h => Number(h.num));

    // 単勝人気マッピング（共通除外ルールで使用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 枠の組み合わせから「3連複（または2頭の馬番ペア）」の候補を生成
    // ※馬単の順序依存（combos.push(`${b}-${a}`)など）を外し、昇順で綺麗に整えます
    const sanrenpukuCombos = [];
    listA.forEach(a => {
        listB.forEach(b => {
            if (a === b) return; // 同一馬番は除外

            // 昇順に並べ替え（例: 2-5）
            let nums = [a, b].sort((x, y) => x - y);
            let comboStr = nums.join("-");

            // 共通除外ルールのチェック（必要に応じて適用）
            // if (isCommonExcluded(comboStr, 0, winRank)) return;

            if (!sanrenpukuCombos.includes(comboStr)) {
                sanrenpukuCombos.push(comboStr);
            }
        });
    });

    if (sanrenpukuCombos.length === 0) return "";

    // ハイライト登録
    window._highlightPairs = window._highlightPairs || [];
    if (!window._highlightPairs.includes(pair)) {
        window._highlightPairs.push(pair);
    }

    // 3連複の組み合わせ文字列を返す
    return sanrenpukuCombos.join(" ");
}

// ============================================
// ★ 枠連2人気の買い目抽出（3連複対応版）
// ============================================
const WAKU2_CONFIG = {
    minWaku2Odds: 4.0,     // 枠連2人気オッズ下限
    maxWaku2Odds: 9.5,     // 枠連2人気オッズ上限
    minWaku1Odds: 3.0,     // 枠連1人気オッズ下限
    maxWaku1Odds: 8.0      // 枠連1人気オッズ上限（※馬単設定は削除・変更）
};

function extractWaku2Buy(wakuren, umatan, tanfuku) {
    const cfg = WAKU2_CONFIG;

    // 枠連データの確認（1人気・2人気の両方が必要）
    const wr1 = wakuren[0]; // 枠連1人気
    const wr2 = wakuren[1]; // 枠連2人気
    if (!wr1 || !wr2) return "";

    const w1Odds = Number(wr1.odds);
    const w2Odds = Number(wr2.odds);

    // ①-1 枠連2人気のオッズチェック (4.0 - 9.5)
    if (w2Odds < cfg.minWaku2Odds || w2Odds > cfg.maxWaku2Odds) return "";

    // ①-2 枠連1人気のオッズチェック (3.0 - 8.0)
    if (w1Odds < cfg.minWaku1Odds || w1Odds > cfg.maxWaku1Odds) return "";

    // 枠連2人気に対応する枠・馬番リスト作成
    const pair = wr2.pair;
    const [wakuA, wakuB] = pair.split("-").map(Number);
    const listA = tanfuku.filter(h => Number(h.waku) === wakuA).map(h => h.num);
    const listB = tanfuku.filter(h => Number(h.waku) === wakuB).map(h => h.num);

    // 単勝人気マッピング（共通除外ルールで使用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 枠の組み合わせから「3連複（または2頭の馬番ペア）」の候補を生成
    // ※馬単の方向（往復）を外し、昇順で重複のないペアを生成
    const sanrenpukuCombos = [];
    listA.forEach(a => {
        listB.forEach(b => {
            if (a === b) return; // 同一馬番は除外

            // 昇順に並べ替え（例: 3-7）
            let nums = [a, b].sort((x, y) => x - y);
            let comboStr = nums.join("-");

            // 共通除外ルールのチェック（必要に応じて適用）
            // if (isCommonExcluded(comboStr, 0, winRank)) return;

            if (!sanrenpukuCombos.includes(comboStr)) {
                sanrenpukuCombos.push(comboStr);
            }
        });
    });

    if (sanrenpukuCombos.length === 0) return "";

    // ハイライト登録
    window._highlightPairs = window._highlightPairs || [];
    if (!window._highlightPairs.includes(pair)) {
        window._highlightPairs.push(pair);
    }

    // 3連複の組み合わせ文字列を返す
    return sanrenpukuCombos.join(" ");
}

// ============================================
// ★ 枠連3人気の買い目抽出（3連複対応版）
// ============================================
const WAKU3_CONFIG = {
    minWaku3Odds: 6.0,     // 枠連3人気オッズ下限
    maxWaku3Odds: 11.5,    // 枠連3人気オッズ上限
    minWaku2Odds: 4.7,     // 枠連2人気オッズ下限
    maxWaku2Odds: 9.5      // 枠連2人気オッズ上限（※馬単設定は削除・変更）
};

function extractWaku3Buy(wakuren, umatan, tanfuku) {
    const cfg = WAKU3_CONFIG;

    // 枠連データの確認（2人気・3人気の両方が必要）
    const wr2 = wakuren[1]; // 枠連2人気
    const wr3 = wakuren[2]; // 枠連3人気
    if (!wr2 || !wr3) return "";

    const w2Odds = Number(wr2.odds);
    const w3Odds = Number(wr3.odds);

    // ①-1 枠連3人気のオッズチェック (6.0 - 11.5)
    if (w3Odds < cfg.minWaku3Odds || w3Odds > cfg.maxWaku3Odds) return "";

    // ①-2 枠連2人気のオッズチェック (4.7 - 9.5)
    if (w2Odds < cfg.minWaku2Odds || w2Odds > cfg.maxWaku2Odds) return "";

    // 枠連3人気に対応する枠・馬番リスト作成
    const pair = wr3.pair;
    const [wakuA, wakuB] = pair.split("-").map(Number);
    const listA = tanfuku.filter(h => Number(h.waku) === wakuA).map(h => h.num);
    const listB = tanfuku.filter(h => Number(h.waku) === wakuB).map(h => h.num);

    // 単勝人気マッピング（共通除外ルールで使用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 枠の組み合わせから「3連複（または2頭の馬番ペア）」の候補を生成
    // ※馬単の方向（往復）を外し、昇順で重複のないペアを生成
    const sanrenpukuCombos = [];
    listA.forEach(a => {
        listB.forEach(b => {
            if (a === b) return; // 同一馬番は除外

            // 昇順に並べ替え（例: 3-7）
            let nums = [a, b].sort((x, y) => x - y);
            let comboStr = nums.join("-");

            // 共通除外ルールのチェック（必要に応じて適用）
            // if (isCommonExcluded(comboStr, 0, winRank)) return;

            if (!sanrenpukuCombos.includes(comboStr)) {
                sanrenpukuCombos.push(comboStr);
            }
        });
    });

    if (sanrenpukuCombos.length === 0) return "";

    // ハイライト登録
    window._highlightPairs = window._highlightPairs || [];
    if (!window._highlightPairs.includes(pair)) {
        window._highlightPairs.push(pair);
    }

    // 3連複の組み合わせ文字列を返す
    return sanrenpukuCombos.join(" ");
}

// ============================================
// ★ 縦2番目の買い目抽出（3連複対応版）
// ============================================

const TATE2_CONFIG = {
    // 枠連2人気のオッズ範囲
    waku2OddsRange: { min: 4.4, max: 9.9 },

    // 縦2番目の枠連人気ごとの許容オッズ範囲
    oddsRange: {
        4: [8.0, 13.5],
        5: [9.0, 19.0],
        6: [12.0, 17.0],
        8: [23.0, 24.0]
    }
    // ※馬単設定（umatanMinOdds, maxUmatanRank）は削除
};

function extractTate2Buy(wakurenResult, umatan, tanfuku) {

    // 1) wakurenResult の中から「枠連2人気」のデータを探してオッズチェック (4.4 - 9.9)
    const wr2 = wakurenResult.list.find(d => Number(d.rank) === 2);
    if (!wr2) return "";
    
    const w2Odds = Number(wr2.odds);
    if (w2Odds < TATE2_CONFIG.waku2OddsRange.min || w2Odds > TATE2_CONFIG.waku2OddsRange.max) {
        return "";
    }

    // 2) 「縦2」の行を取得
    const row = wakurenResult.list.find(d => d.logicText.includes("縦2"));
    if (!row) return "";

    const ninki = Number(row.rank);   // 枠連人気
    const odds  = Number(row.odds);   // 枠連オッズ
    const pair  = row.pair;

    // 3) 対象人気（4・5・6・8）とオッズ範囲チェック
    const range = TATE2_CONFIG.oddsRange[ninki];
    if (!range) return "";

    const [minOdds, maxOdds] = range;
    if (odds < minOdds || odds > maxOdds) return "";

    // 4) 枠 → 馬番展開（3連複向けに重複のない昇順ペアを生成）
    const [w1, w2] = pair.split("-").map(Number);
    const list1 = tanfuku.filter(h => Number(h.waku) === w1).map(h => h.num);
    const list2 = tanfuku.filter(h => Number(h.waku) === w2).map(h => h.num);

    // 単勝人気（共通除外ルールで使用する場合に備えて保持）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    const sanrenpukuCombos = [];
    list1.forEach(a => {
        list2.forEach(b => {
            if (a === b) return; // 同一馬番は除外

            // 昇順に並べ替え（例: 2-6）
            let nums = [a, b].sort((x, y) => x - y);
            let comboStr = nums.join("-");

            // 共通除外ルールのチェック（必要に応じて適用）
            // if (isCommonExcluded(comboStr, 0, winRank)) return;

            if (!sanrenpukuCombos.includes(comboStr)) {
                sanrenpukuCombos.push(comboStr);

                let nums = [a, b].sort((x, y) => x - y);
                let comboStr = nums.join("-");

                // 共通除外ルールのチェック（必要に応じて適用）
                // if (isCommonExcluded(comboStr, 0, winRank)) return;

                if (!sanrenpukuCombos.includes(comboStr)) {
                    sanrenpukuCombos.push(comboStr);
                }
            });
        });

        if (sanrenpukuCombos.length > 0) {

            // ハイライト登録
            window._highlightPairs = window._highlightPairs || [];
            if (!window._highlightPairs.includes(pair)) {
                window._highlightPairs.push(pair);
            }

            // 互換性を保つため、内部の要素構造を { pair, hits: [...] } の形にして格納
            const hitObjects = sanrenpukuCombos.map(comb => ({ pair: comb, odds: "" }));

            if (isTate) {
                tateHits.push({ pair, hits: hitObjects });
            } else {
                uraHits.push({ pair, hits: hitObjects });
            }
        }
    });

    return { tate: tateHits, ura: uraHits };
}

    return sanrenpukuCombos.join(" ");

// ================================
// CNAME 自動判別 → GAS に送信（3連複対応版）
// ================================
async function updateOdds() {

    // ▼ 入力値を確実に取得（IME確定待ち）
    await new Promise(resolve => setTimeout(resolve, 50));

    const raw = document.getElementById('cname').value.trim();

    // ▼ CNAME が空なら即終了
    if (!raw) {
        alert("CNAME を入力してください");
        return;
    }

    // ▼ pw151 / pw153 / pw156 / pw157 を抽出
    const tokens = raw.split(/[\s\n\r]+/).filter(t => t.startsWith("pw"));

    let tanfuku = "";
    let wakuren = "";
    let umatan  = "";
    let sanrenpuku = "";

    tokens.forEach(t => {
        if (t.includes("151")) tanfuku = t;
        if (t.includes("153")) wakuren = t;
        if (t.includes("156")) umatan  = t;
        if (t.includes("157")) sanrenpuku = t; // ★ 3連複の判定を追加
    });

    // ▼ 必須 CNAME が揃っていない場合
    if (!tanfuku || !wakuren || !umatan || !sanrenpuku) {
        alert("単複(151)・枠連(153)・馬単(156)・3連複(157) の CNAME がすべて揃っていません");
        return;
    }

    // ▼ GAS URL 作成（sanrenpuku を追加）
    const url = GAS_URL
        + "?tanfuku=" + encodeURIComponent(tanfuku)
        + "&wakuren=" + encodeURIComponent(wakuren)
        + "&umatan="  + encodeURIComponent(umatan)
        + "&sanrenpuku=" + encodeURIComponent(sanrenpuku);

    let json;

    try {
        const res = await fetch(url);

        if (!res.ok) {
            alert("GAS への接続に失敗しました");
            return;
        }

        json = await res.json();

        if (!json || json.status === "error") {
            alert("GAS エラー: " + (json?.message || "不明なエラー"));
            return;
        }

        // ▼ レース情報が無い場合のガード
        if (!json.race || !json.race.meeting || !json.race.raceNo) {
            alert("レース情報が取得できませんでした");
            return;
        }

        // ★★★ raceInfo を必ず表示状態にする ★★★
        const raceInfoBox = document.getElementById("raceInfo");
        if (raceInfoBox) raceInfoBox.style.display = "block";

        // ▼ レース情報
        renderRaceInfo(json);

        // ▼ タイトル変更
        const meetingName = normalizeMeeting(json.race.meeting || "");
        document.title = `${meetingName}${json.race.raceNo}R`;

        // ▼ 馬データ一覧
        renderHorseDetailTable("horseDetailArea", json.odds.tanfuku || []);

        // ▼ 内部データ更新（3連複も追加）
        window._tanfuku    = json.odds.tanfuku    || [];
        window._wakuren    = json.odds.wakuren    || [];
        window._umatan     = json.odds.umatan     || [];
        window._sanrenpuku = json.odds.sanrenpuku || [];

        // ▼ 生オッズテキスト反映
        document.getElementById('inW').value =
            window._wakuren.map(o => `${o.rank} ${o.pair} ${o.odds}`).join("\n");

        document.getElementById('inT').value =
            window._tanfuku.map(o => {
                const fuku = `${o.fukuMin} - ${o.fukuMax}`;
                return `${o.rank} 枠${o.waku} ${o.num} ${o.tan}\n${fuku}`;
            }).join("\n");

        // ▼ 3連複のテキストエリア（inS）に3連複のデータを流し込む
        const inS = document.getElementById('inS');
        if (inS) {
            inS.value = window._sanrenpuku.map(o => `${o.rank} ${o.pair} ${o.odds}`).join("\n");
        }

        // ★★★ オッズ更新時は的中判定の状態をリセットする ★★★
        resetHitJudge();

        alert("オッズを更新しました。『解析』ボタンを押してください。");

    } catch (e) {
        console.error(e);
        alert("GAS からオッズを取得できませんでした");
        return;
    }

    // ▼ 解析前は結果エリアを隠す
    const buyResultEl = document.getElementById("buyResultArea");
    if (buyResultEl) buyResultEl.classList.add("hidden");
}

        if (typeof extractTateUra6Buy === "function") extractTateUra6Buy(result, umatanData, tanfukuData);
        if (typeof extractTateUra7Buy === "function") extractTateUra7Buy(result, umatanData, tanfukuData);
        if (typeof extractNinki2_3Buy === "function") extractNinki2_3Buy(result, umatanData, tanfukuData);
        if (typeof extractNinki2_4Buy === "function") extractNinki2_4Buy(result, umatanData, tanfukuData);
        // =========================================================================

        // ★ 枠連テーブルを描画（ここで登録された highlightPairs が使われます）
        renderWakurenTable('outW', result);

        // ★ 「縦目」要素は非表示（または削除）
        const infoT = document.getElementById('infoTateme');
        if (infoT) infoT.style.display = 'none';

        // ★ 裏人気 & 2人気（1〜6番目）テキストの生成
        const infoU = document.getElementById('infoUraninki');
        if (infoU) {
            let ref2Text = `2人気「${result.ref2Num}」`;
            
            const maxCount = Math.min(6, result.ref2Partners.length);
            for (let i = 0; i < maxCount; i++) {
                ref2Text += ` 2人気${i + 1}「${result.ref2Partners[i]}」`;
            }

            infoU.innerText = `裏人気 ${result.uraninki} ${ref2Text}`;
            infoU.style.display = 'inline-block';
        }
    } // ← ここで if (dataW.length > 0) が閉じる

    // ============================
    // ② 単複（JSON を直接処理）
    // ============================
    const tanfuku = window._tanfuku;   // ← updateOdds() で保存した JSON
    if (tanfuku && tanfuku.length > 0) {

        // --- 単勝オッズ人気順（rank 昇順） ---
        const winData = [...tanfuku]
            .sort((a, b) => Number(a.rank) - Number(b.rank))
            .map(o => ({
                rank: o.rank,
                waku: o.waku,
                horse: o.num,
                win: o.tan
            }));

        renderMainTable("tblWin", winData, false);

        // --- 複勝オッズ人気順（fukuMin → fukuMax → num） ---
        const placeData = [...tanfuku]
            .sort((a, b) => {
                // ① 下限値
                if (a.fukuMin !== b.fukuMin) {
                    return a.fukuMin - b.fukuMin;
                }
                // ② 上限値
                if (a.fukuMax !== b.fukuMax) {
                    return a.fukuMax - b.fukuMax;
                }
                // ③ 馬番
                return Number(a.num) - Number(b.num);
            })
            .map((o, idx) => ({
                rank: idx + 1,                     // 複勝人気を振り直す
                waku: o.waku,
                horse: o.num,
                pStr: `${o.fukuMin} - ${o.fukuMax}`,   // ★ スペース入り

                fukuMax: o.fukuMax
            }));

        renderMainTable("tblPlace", placeData, true);

    // ============================
    // ③ 3連複

        renderSanrenpukuTable('outS', sanrenpukuData);
    }

    // 買い目結果エリアはまだ非表示
    document.getElementById("buyResultArea").classList.add("hidden");

// --- 以下、既存ロジック統合 ---
// ================================
function calculateTatemePair(fav1, fav2) {
    if (!fav1 || !fav2) return null;
    let n1 = fav1.split('-');
    let n2 = fav2.split('-');
    let common = null;
    for (let i = 0; i < n1.length; i++) {
        let foundIdx = n2.indexOf(n1[i]);
        if (foundIdx !== -1) {
            common = n1[i];
            n1.splice(i, 1);
            n2.splice(foundIdx, 1);
            break;
        }
    }
    if (common) return [n1[0], n2[0]].sort((a, b) => a - b).join('-');
    return null;
}

function calculateUraninki(data, uraNum) {
    if (!uraNum) return 0;
    let count = 0;
    for (let i = 0; i < data.length; i++) {
        if (data[i].pair.split('-').includes(uraNum)) count++;
        else break;
    }
    return count;
}

function analyzeWakurenLogic(data) {
    if (data.length < 2) return { uraNum: '', tateNum: '', tateme: null, uraninki: 0, list: data, ref2Partners: [] };
    const fav1Pair = data[0].pair.split('-');
    const fav2Pair = data[1].pair.split('-');
    let uraNum = fav1Pair.find(n => fav2Pair.includes(n));
    let tateNum = fav1Pair.find(n => !fav2Pair.includes(n));
    if (!uraNum) { uraNum = fav1Pair[0]; tateNum = fav1Pair[1]; }
    if (!tateNum) tateNum = (uraNum === fav1Pair[0]) ? fav1Pair[1] : fav1Pair[0];

    const uraninkiCount = calculateUraninki(data, uraNum);
    let ref2Num = fav2Pair.find(n => !fav1Pair.includes(n)) || fav2Pair[0]; 
    const tatemePair = calculateTatemePair(data[0].pair, data[1].pair);

    let counts = { ura: 0, tate: 0, fav2: 0 };
    let ref2Partners = []; // ★ 2人気の相手枠を順に記録する配列

    const list = data.map(item => {
        const nums = item.pair.split('-');
        let labels = [];
        if (nums.includes(tateNum)) { counts.tate++; labels.push(`<span class="logic-tate">縦${counts.tate}</span>`); }
        if (nums.includes(uraNum)) { counts.ura++; labels.push(`<span class="logic-ura">裏${counts.ura}</span>`); }
        
        if (nums.includes(ref2Num)) { 
            counts.fav2++; 
            labels.push(`<span class="logic-fav2">2人気${counts.fav2}番目</span>`); 

            // ★ 相手の枠番を取得して配列に追加（ゾロ目の場合は自分自身）
            const partner = (nums[0] === ref2Num) ? nums[1] : nums[0];
            ref2Partners.push(partner);
        }
        return { ...item, logicText: labels.join(' '), isTateme: (item.pair === tatemePair) };
    });

    return { 
        uraNum, 
        tateNum, 
        ref2Num, 
        ref2Partners, // ★ 相手枠のリストを返す（例: ["7", "2", "6", ...])
        tateme: tatemePair, 
        uraninki: uraninkiCount, 
        list: list 
    };
}

function parsePairOdds(text, max = 999) {
    return text.split('\n').map(line => {
        const m = line.match(/(\d+)\s+(\d+[\-]\d+)\s+([\d\.]+)/);
        return m ? { rank: m[1], pair: m[2], odds: m[3] } : null;
    }).filter(x => x).slice(0, max);
}

function parseTanshoFukusho(text) {
    const tokens = text.split(/[\s\n\r]+/).filter(t => t.length > 0);
    let res = [];
    for (let i = 0; i < tokens.length; i++) {
        if (tokens[i+1] && tokens[i+1].startsWith("枠")) {
            let win = "0.0", pMin = 999, pStr = "---";
            for (let j = i+4; j < i+12; j++) {
                if (!isNaN(tokens[j]) && !tokens[j].includes("-")) {
                    win = tokens[j];
                    if (tokens[j+1] && tokens[j+2] === "-") {
                        pMin = parseFloat(tokens[j+1]);
                        pStr = tokens[j+1] + "-" + tokens[j+3];
                    }
                    break;
                }
            }
            res.push({ rank: tokens[i], waku: tokens[i+1].replace("枠","").charAt(0), horse: tokens[i+2], win, pMin, pStr });
        }
    }
    return res;
}

    let horses1 = getHorsesByWaku(parts[0], horseList);
    let horses2 = getHorsesByWaku(parts[1], horseList);

    for (let h1 of horses1) {
        for (let h2 of horses2) {
            let r1 = getTanfukuRankByHorse(h1, horseList);
            let r2 = getTanfukuRankByHorse(h2, horseList);

            if (r1 === null || r2 === null) continue;

            for (let rule of rules) {
                if ((r1 === rule.baseRank && rule.targetRanks.includes(r2)) ||
                    (r2 === rule.baseRank && rule.targetRanks.includes(r1))) {
                    return true;
                }
            }
        }
    }
    return false;
}

// 2. 共通ヘルパー関数
// ==========================================================
function createSanrenpukuWaku(basePair, targetPair) {
    if (!basePair || !targetPair) return null;
    let baseSet = basePair.split("-").map(Number);
    let targetSet = targetPair.split("-").map(Number);
    
    let combined = [...new Set([...baseSet, ...targetSet])];
    if (combined.length !== 3) return null;
    
    let remaining = combined.filter(n => !baseSet.includes(n));
    
    if (remaining.length > 0) {
        return `${basePair}-${remaining[0]}`;
    } else {
        return combined.sort((a, b) => a - b).join("-");
    }
}

// ==========================================================
const ScoreCalculator = {
    calculate: function(combo, baseName, targetName) {
        let relationPoint = 0;
        if (SANRENPUKU_MATRIX[baseName] && SANRENPUKU_MATRIX[baseName][targetName]) {
            relationPoint = SANRENPUKU_MATRIX[baseName][targetName].point;
        }

        let basePoint = BASE_TOTAL_POINTS[baseName] || 0;

        return {
            total: relationPoint + basePoint,
            relation: relationPoint,
            base: basePoint
        };
    }
};

// 4. 各条件名から対応する枠番ペアを取得するヘルパー（裏5・裏6僅差相互抽出組み込み版）
// ==========================================================
function getPairByName(name, wakurenResult, wakuren) {
    if (name === "1人気") return wakuren[0] ? wakuren[0].pair : null;
    if (name === "2人気") return wakuren[1] ? wakuren[1].pair : null;
    if (name === "3人気") return wakuren[2] ? wakuren[2].pair : null;

    const list = wakurenResult.list || [];

    // ★ 裏5・裏6の僅差（0.3以内）判定と相互抽出ロジック
    if (name === "裏5番目" || name === "裏6番目") {
        const u5Row = list.find(d => d.logicText && d.logicText.includes("裏5"));
        const u6Row = list.find(d => d.logicText && d.logicText.includes("裏6"));

        if (u5Row && u6Row) {
            const o5 = parseFloat(u5Row.odds);
            const o6 = parseFloat(u6Row.odds);

            if (!isNaN(o5) && !isNaN(o6) && Math.abs(o5 - o6) <= 0.3) {
                // オッズ差が0.3以内の場合、対象に応じて相手方のペアを返す
                if (name === "裏5番目") return u6Row.pair;
                if (name === "裏6番目") return u5Row.pair;
            }
        }
    }

    let searchKey = "";

    if (name.startsWith("縦")) {
        searchKey = name.replace("番目", "");
    } else if (name.startsWith("裏")) {
        searchKey = name.replace("人気", "").replace("番目", "");
        
        if (name === "裏3番目") {
            // 必要に応じて除外条件
        }
    } else if (name.startsWith("2人気")) {
        searchKey = name;
    }

    const matchedRow = list.find(d => d.logicText && d.logicText.includes(searchKey));
    return matchedRow ? matchedRow.pair : null;
}

// --- 除外レース判定関数 ---
// ================================
function isRaceOmitted(wakuren) {
    if (!wakuren || wakuren.length < 2) return false;

    const pair1 = wakuren[0].pair;
    const pair2 = wakuren[1].pair;

    const isZorome = p => {
        if (!p) return false;
        const [a, b] = p.split("-");
        return a === b;
    };

    return isZorome(pair1) || isZorome(pair2);
}

// ==========================================================
// 5. メイン抽出・集計エンジン（結果判定組み込み版）
// ==========================================================
function extractBuy() {
    if (!window._wakurenResult) {
        alert("解析結果がありません。先に『解析』を実行してください。");
        return;
    }

    window._highlightPairs = window._highlightPairs || [];
    
    const wakurenResult = window._wakurenResult;
    const wakuren = window._wakuren;
    const horseList = window._tanfuku || window._horseList || []; 
    const sanrenpukuOddsList = window._sanrenpuku || (window._raceData && window._raceData.odds && window._raceData.odds.sanrenpuku) || [];

    const buyResultEl = document.getElementById("buyResult");
    const buyCountEl = document.getElementById("buyCount");
    const finalScoreArea = document.getElementById("finalScoreArea");

    if (buyResultEl) buyResultEl.innerHTML = "";
    if (buyCountEl) buyCountEl.innerText = "";
    if (finalScoreArea) finalScoreArea.innerHTML = "";

    if (isRaceOmitted(wakuren)) {
        if (buyResultEl) {
            buyResultEl.innerHTML = `<span style="color:red; font-weight:bold; font-size:18px;">見送り</span>`;
        }
        const buyArea = document.getElementById("buyResultArea");
        if (buyArea) buyArea.classList.remove("hidden");
        return;
    }

    let scoreMap = {};      
    let detailMap = {};     
    let resultHtml = "";

    let seenPairs = new Set();
    let activeBases = {};

    const highlights = window._highlightPairs;
    const hasHighlight = highlights && highlights.length > 0;

    for (let baseName in SANRENPUKU_MATRIX) {
        let basePair = getPairByName(baseName, wakurenResult, wakuren);
        if (!basePair) continue;

        if (hasHighlight) {
            let isBaseMatched = highlights.includes(basePair);
            
            let isValidRelatedBase = false;
            if (!isBaseMatched) {
                let targetsOfHighlightBase = SANRENPUKU_MATRIX["縦6番目"] || SANRENPUKU_MATRIX[Object.keys(SANRENPUKU_MATRIX).find(k => getPairByName(k, wakurenResult, wakuren) === highlights[0])] || {};
                
                let hasHighlightInTarget = Object.keys(SANRENPUKU_MATRIX[baseName]).some(tName => {
                    let tPair = getPairByName(tName, wakurenResult, wakuren);
                    return highlights.includes(tPair);
                });

                let isTargetOfHighlight = false;
                for (let hBaseName in SANRENPUKU_MATRIX) {
                    let hBasePair = getPairByName(hBaseName, wakurenResult, wakuren);
                    if (highlights.includes(hBasePair)) {
                        let subTargets = SANRENPUKU_MATRIX[hBaseName];
                        if (subTargets[baseName] !== undefined || Object.keys(subTargets).some(stName => getPairByName(stName, wakurenResult, wakuren) === basePair)) {
                            isTargetOfHighlight = true;
                            break;
                        }
                    }
                }

                isValidRelatedBase = hasHighlightInTarget && isTargetOfHighlight;
            }

            if (!isBaseMatched && !isValidRelatedBase) {
                continue;
            }
        }

        if (seenPairs.has(basePair)) {
            continue;
        }
        seenPairs.add(basePair);
        activeBases[baseName] = basePair;
    }

    for (let baseName in activeBases) {
        let basePair = activeBases[baseName];
        
        if (!checkTankoFilter(baseName, basePair, horseList)) {
            continue;
        }

        let targets = SANRENPUKU_MATRIX[baseName];
        let horsePairDisplayStr = getHorsePairDisplay(basePair, horseList);
        let baseSectionHtml = `<strong>【${baseName}ベース (${basePair})】</strong> 馬番：${horsePairDisplayStr}<br>`;
        let hasHit = false;

        let seenWakuInBase = new Set();

        for (let targetName in targets) {
            let targetPair = getPairByName(targetName, wakurenResult, wakuren);

            if (targetPair) {
                if (hasHighlight) {
                    let isBaseMatched = highlights.includes(basePair);
                    let isTargetMatched = highlights.includes(targetPair);

                    if (isBaseMatched) {
                        // パターンA: 縦6ベースのときはすべてのターゲットOK
                    } else {
                        // パターンB: 別ベースのときは、相手（ターゲット）がハイライト（縦6）であるものだけを許可
                        if (!isTargetMatched) {
                            continue;
                        }
                    }
                }

                if (targetName === "裏3番目") {
                    let ura3NinkiPair = getPairByName("裏3人気", wakurenResult, wakuren);
                    if (ura3NinkiPair && ura3NinkiPair === targetPair) {
                        continue;
                    }
                }

                let sanrenpukuWaku = createSanrenpukuWaku(basePair, targetPair);
                if (sanrenpukuWaku) {
                    hasHit = true;
                    
                    let scoreDetails = ScoreCalculator.calculate(sanrenpukuWaku, baseName, targetName);
                    let finalScore = scoreDetails.total;

                    let wakuNums = sanrenpukuWaku.split("-").map(Number).sort((a, b) => a - b);
                    let normalizedKey = wakuNums.join("-");

                    if (seenWakuInBase.has(normalizedKey)) {
                        finalScore = 0;
                    } else {
                        seenWakuInBase.add(normalizedKey);
                    }

                    scoreMap[normalizedKey] = (scoreMap[normalizedKey] || 0) + finalScore;

                    if (!detailMap[normalizedKey]) {
                        detailMap[normalizedKey] = [];
                    }
                    detailMap[normalizedKey].push({
                        wakuStr: sanrenpukuWaku,
                        score: finalScore,
                        baseName: baseName,
                        targetName: targetName
                    });

                    baseSectionHtml += `&nbsp;&nbsp;- ${targetName} (${targetPair}) → 枠 ${sanrenpukuWaku} (スコア:+${finalScore})<br>`;
                }
            }
        }

        if (hasHit) {
            resultHtml += baseSectionHtml + "<br>";
        }
    }

    if (!resultHtml) {
        resultHtml = "該当する買い目はありません。";
    }

    const sortedCombos = Object.keys(scoreMap).sort((a, b) => {
        if (scoreMap[b] !== scoreMap[a]) {
            return scoreMap[b] - scoreMap[a];
        }
        return a.localeCompare(b);
    });

    const selectElem = document.getElementById("topCountSelect");
    const limitCount = selectElem ? parseInt(selectElem.value, 10) || 30 : 30;
    const topCombos = sortedCombos.slice(0, limitCount);

    function getSanrenpukuOdds(h1, h2, h3) {
        let targetNums = [Number(h1), Number(h2), Number(h3)].sort((a, b) => a - b).join("-");
        let found = sanrenpukuOddsList.find(o => {
            if (!o.pair) return false;
            let pNums = o.pair.split("-").map(Number).sort((a, b) => a - b).join("-");
            return pNums === targetNums;
        });
        return found ? parseFloat(found.odds) : null;
    }

    let finalHtml = "";
    let totalValidCount = 0;
    let recommendedBlockHtml = "";
    let validCombosList = []; // ★的中判定用のリスト

    topCombos.forEach(comboKey => {
        let parts = comboKey.split("-");
        let hList1 = getHorsesByWaku(parts[0], horseList);
        let hList2 = getHorsesByWaku(parts[1], horseList);
        let hList3 = getHorsesByWaku(parts[2], horseList);
        
        let horseDisplayStr = `${hList1.join("・")} - ${hList2.join("・")} - ${hList3.join("・")}`;
        
        let blockLines = `<strong>【枠 ${comboKey}】【馬番 ${horseDisplayStr}】</strong><br>`;
        let hasValidInThisCombo = false;
        let tempLines = "";

        hList1.forEach(h1 => {
            hList2.forEach(h2 => {
                hList3.forEach(h3 => {
                    let odds = getSanrenpukuOdds(h1, h2, h3);
                    if (odds !== null && odds < 500.0) {
                        hasValidInThisCombo = true;
                        totalValidCount++;
                        let comboStr = [h1, h2, h3].sort((a, b) => a - b).join("-");
                        
                        validCombosList.push(comboStr); // 有効な組み合わせを蓄積

                        // 的中対象の組み合わせに一致するかどうかで色を変更
                        let isThisMatched = (window._currentHitTarget === comboStr);
                        let fontColor = isThisMatched ? "red" : "#2b6cb0";
                        let fontWeight = isThisMatched ? "bold" : "bold";
                        let hitSuffix = isThisMatched ? " ← 的中" : "";
                        
                        let styledComboStr = `<span style="color: ${fontColor}; font-weight: ${fontWeight};">${comboStr.padEnd(10, ' ')}</span>`;
                        tempLines += `${styledComboStr} (${odds.toFixed(1)})${hitSuffix}<br>`;

                        if (totalValidCount % 10 === 0) {
                            let padDash = "-".repeat(27);
                            tempLines += `${padDash} ${totalValidCount}<br>`;
                        }
                    }
                });
            });
        });

        if (hasValidInThisCombo) {
            recommendedBlockHtml += blockLines + tempLines;
        }
    });

    // 判定用にグローバルへ保存
    window._validBuyCombos = validCombosList;
    // プルダウンを初期化して1〜18を選択可能にする
    initHitSelectors();

    if (recommendedBlockHtml) {
        finalHtml = `<div style="background: #f9f9f9; border: 1px solid #ccc; padding: 12px; margin-bottom: 15px; border-radius: 4px; font-family: monospace; font-size: 1.1rem; line-height: 1.6;">` +
                    `<strong>【最終おすすめ3連複（上位30点）】</strong><br><br>` +
                    recommendedBlockHtml +
                    `</div>`;
    }

    let scoreRankHtml = `<strong>【スコア順】</strong><br><br>`;
    sortedCombos.forEach((comboKey, index) => {
        let totalScore = scoreMap[comboKey];
        let details = detailMap[comboKey] || [];

        let parts = comboKey.split("-");
        let h1 = getHorsesByWaku(parts[0], horseList).join("・");
        let h2 = getHorsesByWaku(parts[1], horseList).join("・");
        let h3 = getHorsesByWaku(parts[2], horseList).join("・");
        let horseDisplayStr = `${h1} - ${h2} - ${h3}`;

        scoreRankHtml += `スコア${index + 1}位 枠 ${comboKey} (スコア:計${totalScore}) 馬番 ${horseDisplayStr}<br><br>`;

        details.forEach(d => {
            let subParts = d.wakuStr.split("-");
            let subH3 = getHorsesByWaku(subParts[2], horseList).join("・");
            let subHorseDisplay = `${getHorsesByWaku(subParts[0], horseList).join("・")} - ${getHorsesByWaku(subParts[1], horseList).join("・")} │ - ${subH3}`;

            scoreRankHtml += `&nbsp;&nbsp;枠 ${d.wakuStr} (スコア:+${d.score}) │ 馬番 ${subHorseDisplay}<br>`;
        });
        scoreRankHtml += `<br>`;
    });

    if (buyResultEl) {
        buyResultEl.innerHTML = finalHtml + scoreRankHtml + `<br><strong>【ベース別詳細とスコア換算】</strong><br><br>` + resultHtml;
    }
    if (buyCountEl) {
        buyCountEl.innerText = totalValidCount === 0 ? "" : `3連複抽出（総候補数）：${totalValidCount} 点`;
    }
    
    const buyResultArea = document.getElementById("buyResultArea");
    if (buyResultArea) {
        buyResultArea.classList.remove("hidden");
    }

    if (typeof renderWakurenTable === "function") {
        const targetId = document.getElementById("wakurenArea") ? "wakurenArea" : "outW";
        renderWakurenTable(targetId, wakurenResult);
    }
}

// ============================================
// ★ 的中結果判定用の補助関数
// ============================================

// 1〜18の馬番プルダウンを初期化・構築する関数
function initHitSelectors() {
    ['hitH1', 'hitH2', 'hitH3'].forEach(id => {
        let sel = document.getElementById(id);
        if (!sel) return;
        let currentVal = sel.value;
        sel.innerHTML = '<option value="">--</option>';
        for (let i = 1; i <= 18; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = i;
            if (String(i) === currentVal) opt.selected = true;
            sel.appendChild(opt);
        }
    });
}

// 「結果」ボタンをクリックしたときの判定処理
function checkHitResult() {
    let h1 = document.getElementById('hitH1').value;
    let h2 = document.getElementById('hitH2').value;
    let h3 = document.getElementById('hitH3').value;
    let judgeEl = document.getElementById('hitJudgeDisplay');

    if (!h1 || !h2 || !h3) {
        alert("3つの馬番をすべて選択してください。");
        return;
    }

    // 選択された馬番を昇順ソートしてキー化 (例: "3-8-14")
    let selectedCombo = [Number(h1), Number(h2), Number(h3)].sort((a, b) => a - b).join("-");

    // 抽出された有効な組み合わせリストに含まれているか判定
    let validCombos = window._validBuyCombos || [];
    let isMatched = validCombos.includes(selectedCombo);

    if (isMatched) {
        judgeEl.innerHTML = `<span style="color: red;">的中：${selectedCombo}</span>`;
    } else {
        judgeEl.innerHTML = `<span style="color: blue;">ハズレ</span>`;
    }

    // 判定状態を保持して再描画（買い目一覧の該当部分を赤字にするため）
    window._currentHitTarget = isMatched ? selectedCombo : null;
    if (typeof extractBuy === "function" && window._wakurenResult) {
        // 再描画を安全に行うため、内部ロジックを再実行してハイライトを反映
        // ※無限ループ防止のため、HTML再描画部分だけを更新するのが理想ですが、
        //   シンプルに現在の状態のまま表示を更新したい場合はDOM書換処理を呼びます。
        refreshBuyResultHighlight(selectedCombo, isMatched);
    }
}

// 買い目一覧の表示から該当の組み合わせを赤文字にするハイライト補助
function refreshBuyResultHighlight(targetCombo, isMatched) {
    let buyResultEl = document.getElementById("buyResult");
    if (!buyResultEl) return;
    
    // すでに描画されているテキスト内から該当の組み合わせ文字列を探してスタイルを変更
    // （完全版のループ内で自動的に window._currentHitTarget を参照して色分けされるよう組み込んでいます）
    extractBuy(); // 再計算・再描画
    let judgeEl = document.getElementById('hitJudgeDisplay');
    if (judgeEl) {
        if (isMatched) {
            judgeEl.innerHTML = `<span style="color: red;">的中：${targetCombo}</span>`;
        } else {
            judgeEl.innerHTML = `<span style="color: blue;">ハズレ</span>`;
        }
    }
}

// 的中判定エリアや選択状態を完全にクリアする関数
function resetHitJudge() {
    // 1. プルダウンの選択を未選択（"--"）に戻す
    ['hitH1', 'hitH2', 'hitH3'].forEach(id => {
        let sel = document.getElementById(id);
        if (sel) sel.value = "";
    });

    // 2. 判定結果の表示（的中・ハズレ）をクリア
    let judgeEl = document.getElementById('hitJudgeDisplay');
    if (judgeEl) judgeEl.innerHTML = "";

    // 3. 内部の判定ターゲット情報をクリア
    window._currentHitTarget = null;
    window._validBuyCombos = [];
}

// ============================================
// ★ UI・レンダリング制御（改善版）
// ============================================

function getBuyConditions() {
    const conds = {};
    document.querySelectorAll(".cond").forEach(c => {
        conds[c.value] = c.checked;
    });
    return conds;
}

// --- 馬データ一覧テーブル生成関数 ---
function renderHorseDetailTable(targetId, tanfukuRows) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = "";

    let html = `
        <table class="horse-detail">
            <tr>
                <th>人気</th>
                <th>枠</th>
                <th>馬番</th>
                <th>馬名</th>
                <th>単勝</th>
                <th>複勝</th>
                <th>性齢</th>
                <th>馬体重</th>
                <th>負担重量</th>
                <th>騎手名</th>
                <th>調教師名</th>
            </tr>
    `;

    tanfukuRows.forEach(r => {
        // 枠画像
        const wakuImg = `<img src="waku/${r.waku}.png" alt="${r.waku}" width="20">`;

        // 単勝オッズ（10.0 以下 → 赤太字）
        const tanClass = Number(r.tan) <= 10.0 ? "odds-red" : "";

        // 複勝オッズ（データ不足時の未定義防止）
        const fukuMin = r.fukuMin ?? "-";
        const fukuMax = r.fukuMax ?? "-";
        const fukuStr = (fukuMin === "-" && fukuMax === "-") ? "-" : `${fukuMin} - ${fukuMax}`;

        html += `
            <tr>
                <td>${r.rank ?? ""}</td>
                <td>${wakuImg}</td>
                <td>${r.num ?? ""}</td>
                <td>${r.horse ?? ""}</td>
                <td class="${tanClass}">${r.tan ?? ""}</td>
                <td>${fukuStr}</td>
                <td>${r.age ?? ""}</td>
                <td>${r.hWeight ?? ""}</td>
                <td>${r.weight ?? ""}</td>
                <td>${r.jockey ?? ""}</td>
                <td>${r.trainer ?? ""}</td>
            </tr>
        `;
    });

    html += `</table>`;
    target.innerHTML = html;
}

// --- 3連複オッズテーブル生成関数（DOM負荷低減版） ---
function renderSanrenpukuTable(targetId, data) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = '';

    const perCol = 60;   // ★ 1カラムあたりの表示件数（必要に応じて変更可能）
    const maxCols = 4;   // ★ 最大カラム数
    const total = data.length;
    const cols = Math.min(maxCols, Math.ceil(total / perCol));
    
    let allColsHtml = ""; // 全カラムのHTMLを一時保持する変数

    for (let col = 0; col < cols; col++) {
        const start = col * perCol;
        const end = start + perCol;
        const slice = data.slice(start, end);

        if (slice.length === 0) continue;

        let html = `<table class="w-tbl">
            <tr><th>人気</th><th>組番</th><th>オッズ</th></tr>`;

        slice.forEach(d => {
            html += `<tr>
                <td>${d.rank ?? ""}</td>
                <td style="background:#fffde7">${d.pair ?? ""}</td>
                <td>${d.odds ?? ""}</td>
            </tr>`;
        });

        html += `</table>`;
        allColsHtml += html; // ループ内でのDOM反映を避け、文字列として結合
    }
    
    // 最後にまとめてDOMに一度だけ流し込む
    target.innerHTML = allColsHtml;
}
