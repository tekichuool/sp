<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>てきちゅーる</title>
    <style>
* { box-sizing: border-box; }

body { 
    font-family: "Helvetica Neue", Arial, sans-serif; 
    background: #fff;
    margin: 0;
    padding: 5px 5px 100px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* 10.0倍以下のオッズを赤色に */
.odds-red {
    color: #d32f2f !important;
    font-weight: bold;
}

/* 馬データ一覧テーブル整形 10.0倍以下のオッズを赤太字 */

.horse-detail {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 13px;
}

.horse-detail th,
.horse-detail td {
    border: 1px solid #ccc;
    padding: 6px 8px;
    text-align: left;
}

.odds-red {
    color: red;
    font-weight: bold;
}

/* 縦（水色） */
.logic-tate {
    color: #0288d1;          /* 濃い水色 */
    font-weight: bold;
    background: #e1f5fe;     /* 薄い水色背景 */
    padding: 1px 4px;
    border-radius: 3px;
}

/* 裏（赤） */
.logic-ura {
    color: #d32f2f;          /* 赤 */
    font-weight: bold;
    background: #ffebee;     /* 薄い赤背景 */
    padding: 1px 4px;
    border-radius: 3px;
}

/* 2人気◯番目（緑） */
.logic-fav2 {
    color: #2e7d32;          /* 緑 */
    font-weight: bold;
    background: #e8f5e9;     /* 薄い緑背景 */
    padding: 1px 4px;
    border-radius: 3px;
}

/* ★ ここを固定幅 → 可変幅に変更 */
.main-wrapper { 
    width: 100%;
    max-width: 1200px;
    padding-bottom: 50px;
}

/* Table Header の文字サイズをオッズと同じに統一 */
.w-tbl th,
.occ-tbl th,
.main-table th {
    font-size: 11px !important;
}

/* 入力エリア */
.input-section { 
    display: flex;
    flex-wrap: wrap; /* ★ スマホで折り返し */
    gap: 10px; 
    margin-bottom: 10px;
    background: #f4f4f4;
    padding: 10px;
    border-radius: 4px;
}
.input-box { flex: 1; min-width: 250px; }

/* テキストエリア */
textarea { 
    width: 100%; 
    height: 80px; 
    border: 1px solid #ccc; 
    font-size: 11px; 
    padding: 5px; 
    resize: none; 
}

/* ボタン */
.button-group { 
    display: flex; 
    flex-wrap: wrap; /* ★ スマホ対応 */
    justify-content: center; 
    gap: 20px; 
    margin-bottom: 15px; 
}

/* セクションヘッダ */
.section-header { 
    background: #334455; 
    color: #fff; 
    padding: 4px 10px; 
    font-size: 11px; 
    font-weight: bold; 
    margin-top: 10px; 
}

/* テーブル全体をスクロール可能にする（スマホ対応） */
.table-container { 
    width: 100%; 
    overflow-x: auto; /* ★ 横スクロール許可 */
    border: 1px solid #999; 
    margin-bottom: 15px; 
    background: #fff; 
}

/* テーブル */
table.main-table { 
    border-collapse: collapse; 
    width: 100%; 
    table-layout: fixed; /* ★ セル幅均等化 */
}

th.label-col { 
    width: 35px; 
    background: #667788; 
    color: #fff; 
    font-size: 10px; 
    text-align: center; 
    border-right: 2px solid #333; 
}

td { 
    border: 1px solid #ccc; 
    text-align: left; 
    padding: 2px 2px; 
    font-size: 11px; 
    font-weight: bold; 
    white-space: nowrap; 
}

/* 枠連・馬単テーブルの横並びレイアウト */
#outW, #outU {
    display: flex;
    flex-wrap: nowrap;   /* ← 折り返し禁止 */
    gap: 10px;
    overflow-x: auto;    /* ← 横スクロール許可 */
    padding-bottom: 5px;
    padding-left: 15px;  /* ← ★ 左側に余白を追加 */
}

/* 枠連・馬単テーブルの組番列を広くする */
.w-tbl td:nth-child(2),
.w-tbl th:nth-child(2) {
    width: 40px;       /* ← 好きな幅に調整可能（60〜80推奨） */
    min-width: 40px;
}

#bottom-odds-area {
    width: 100%;
    max-width: 1200px;
    margin: 40px auto 0 auto;
    padding-bottom: 50px;
}

.raw-odds {
    width: 100%;
    height: 140px;
    margin-bottom: 25px;
    font-size: 12px;
    white-space: pre;
}

.race-info-box {
    background: #f5f5f5;
    border-left: 4px solid #1976d2;
    padding: 12px 15px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 1.6;
}

.race-posttime {
    color: red;
    font-weight: bold;
}

.race-refresh {
    color: #0288d1; /* 濃い水色 */
    font-weight: bold;
}

/* 買い目条件エリア */
.hidden {
    display: none;
}

.condition-row {
    margin-bottom: 8px;
    font-size: 14px;
}

.condition-row label {
    margin-right: 15px;
}

/* 買い目枠連人気 ハイライト表示 */
.highlight-cell {
    background-color: #ffeb3b !important;
    font-weight: bold;
}

.waku-cell {
    background: #fffde7;
}

/* ★ 目に優しいマイルドな黄色に変更 */
.highlight-cell {
    background: #fff59d !important; /* パステル調の優しい黄色 */
    color: #333333 !important;       /* 文字のコントラストを保ち、読みやすく */
}

/* スマホ向け調整 */
@media (max-width: 900px) {
    .main-wrapper {
        padding: 0 5px;
    }
    table.main-table {
        font-size: 10px;
    }
    td, th {
        padding: 2px;
    }
}

<script>
// ============================================
// ★ 枠連1人気の買い目抽出
// ============================================
const WAKU1_CONFIG = {
    minWaku1Odds: 3.0,     // 枠連1人気オッズ下限
    maxWaku1Odds: 8.2,     // 枠連1人気オッズ上限
    minWaku2Odds: 4.8,     // 枠連2人気オッズ下限
    maxWaku2Odds: 8.9,     // 枠連2人気オッズ上限
    minUmatanOdds: 15.0,   // 馬単オッズ下限
    maxUmatanRank: 35,     // 馬単人気上限（35人気まで）
    allowedUraRanks: [2, 3, 4, 5, 6] // 裏人気が2〜6の時
};

function extractWaku1Buy(wakuren, umatan, tanfuku) {
    const cfg = WAKU1_CONFIG;

    // 枠連データの確認（1人気・2人気の両方が必要）
    const wr1 = wakuren[0]; // 枠連1人気
    const wr2 = wakuren[1]; // 枠連2人気
    if (!wr1 || !wr2) return "";

    const w1Odds = Number(wr1.odds);
    const w2Odds = Number(wr2.odds);

    // ①-1 枠連1人気のオッズチェック (3.0 - 8.2)
    if (w1Odds < cfg.minWaku1Odds || w1Odds > cfg.maxWaku1Odds) return "";

    // ①-2 枠連2人気のオッズチェック (4.8 - 8.9)
    if (w2Odds < cfg.minWaku2Odds || w2Odds > cfg.maxWaku2Odds) return "";

    // 裏人気のチェック（analyzeWakurenLogic を利用して判定）
    const logicResult = analyzeWakurenLogic(wakuren);
    if (cfg.allowedUraRanks && !cfg.allowedUraRanks.includes(logicResult.uraninki)) {
        return "";
    }

    // ----------------------------------------------------
    // ★ 枠連条件を満たしたため、ここでハイライト登録を実行
    // ----------------------------------------------------
    const pair = wr1.pair;
    window._highlightPairs = window._highlightPairs || [];
    if (!window._highlightPairs.includes(pair)) {
        window._highlightPairs.push(pair);
    }

    // 枠連1人気に対応する枠・馬番リスト作成
    const [wakuA, wakuB] = pair.split("-").map(Number);
    const listA = tanfuku.filter(h => Number(h.waku) === wakuA).map(h => h.num);
    const listB = tanfuku.filter(h => Number(h.waku) === wakuB).map(h => h.num);

    // 枠連1人気に対応した馬番の全ペア（馬単の方向両方）
    const combos = [];
    listA.forEach(a => listB.forEach(b => {
        combos.push(`${a}-${b}`);
        combos.push(`${b}-${a}`);
    }));

    // 単勝人気マッピング（共通除外ルールで使用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 馬単データをオッズ順にソートして「馬単人気順位」を付与
    const sortedUmatan = [...umatan].sort((a, b) => Number(a.odds) - Number(b.odds));
    const umatanRankMap = {};
    sortedUmatan.forEach((u, index) => {
        umatanRankMap[u.pair] = index + 1; // 1人気, 2人気...
    });

    // ②・③ 馬単の抽出と除外判定（1段階目と2段階目の振分け用）
    const hits = umatan
        .filter(u => combos.includes(u.pair))
        .map(u => {
            const uOdds = Number(u.odds);
            const uRank = umatanRankMap[u.pair] || 999;

            // 除外条件判定（共通除外条件、オッズ下限、人気上限）
            const isExcluded = isCommonExcluded(u.pair, uOdds, winRank) ||
                               (uOdds < cfg.minUmatanOdds) ||
                               (uRank > cfg.maxUmatanRank);

            return {
                pair: u.pair,
                odds: u.odds,
                isExcluded: isExcluded
            };
        });

    if (hits.length === 0) return "";

    // オブジェクト構造で返却
    return {
        pair: pair,
        hits: hits
    };
}

// ============================================
// ★ 枠連2人気の買い目抽出
// ============================================
const WAKU2_CONFIG = {
    minWaku2Odds: 4.0,     // 枠連2人気オッズ下限
    maxWaku2Odds: 9.5,     // 枠連2人気オッズ上限
    minWaku1Odds: 3.0,     // 枠連1人気オッズ下限
    maxWaku1Odds: 8.0,     // 枠連1人気オッズ上限
    minUmatanOdds: 16.0,   // 馬単オッズ下限
    maxUmatanRank: 100,    // 馬単人気上限（100人気まで）
    allowedUraRanks: [2, 3, 4, 5, 6, 7] // ★ 追加：裏人気が2〜7の時
};

function extractWaku2Buy(wakuren, umatan, tanfuku) {
    const cfg = WAKU2_CONFIG;

    // 枠連データの確認（1人気・2人気の両方が必要）
    const wr1 = wakuren[0]; // 枠連1人気
    const wr2 = wakuren[1]; // 枠連2人気
    if (!wr1 || !wr2) return "";

    const w1Odds = Number(wr1.odds);
    const w2Odds = Number(wr2.odds);

    // ①-1 枠連2人気のオッズチェック (4.0 - 9.5)
    if (w2Odds < cfg.minWaku2Odds || w2Odds > cfg.maxWaku2Odds) return "";

    // ①-2 枠連1人気のオッズチェック (3.0 - 8.0)
    if (w1Odds < cfg.minWaku1Odds || w1Odds > cfg.maxWaku1Odds) return "";

    // ★ 追加：裏人気のチェック（analyzeWakurenLogic を利用して判定）
    const logicResult = analyzeWakurenLogic(wakuren);
    if (cfg.allowedUraRanks && !cfg.allowedUraRanks.includes(logicResult.uraninki)) {
        return "";
    }

    // ----------------------------------------------------
    // ★ 枠連条件を満たしたため、ここでハイライト登録を実行
    // ----------------------------------------------------
    const pair = wr2.pair;
    window._highlightPairs = window._highlightPairs || [];
    if (!window._highlightPairs.includes(pair)) {
        window._highlightPairs.push(pair);
    }

    // 枠連2人気に対応する枠・馬番リスト作成
    const [wakuA, wakuB] = pair.split("-").map(Number);
    const listA = tanfuku.filter(h => Number(h.waku) === wakuA).map(h => h.num);
    const listB = tanfuku.filter(h => Number(h.waku) === wakuB).map(h => h.num);

    // 枠連2人気に対応した馬番の全ペア（馬単の方向両方）
    const combos = [];
    listA.forEach(a => listB.forEach(b => {
        combos.push(`${a}-${b}`);
        combos.push(`${b}-${a}`);
    }));

    // 単勝人気マッピング（共通除外ルールで使用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 馬単データをオッズ順にソートして「馬単人気順位」を付与
    const sortedUmatan = [...umatan].sort((a, b) => Number(a.odds) - Number(b.odds));
    const umatanRankMap = {};
    sortedUmatan.forEach((u, index) => {
        umatanRankMap[u.pair] = index + 1; // 1人気, 2人気...
    });

    // ②・③ 馬単の抽出と除外判定（1段階目と2段階目の振分け用）
    const hits = umatan
        .filter(u => combos.includes(u.pair))
        .map(u => {
            const uOdds = Number(u.odds);
            const uRank = umatanRankMap[u.pair] || 999; // 馬単人気

            // 除外条件判定（共通除外条件、オッズ下限、人気上限）
            const isExcluded = isCommonExcluded(u.pair, uOdds, winRank) ||
                               (uOdds < cfg.minUmatanOdds) ||
                               (uRank > cfg.maxUmatanRank);

            return {
                pair: u.pair,
                odds: u.odds,
                isExcluded: isExcluded
            };
        });

    if (hits.length === 0) return "";

    // オブジェクト構造で返却
    return {
        pair: pair,
        hits: hits
    };
}

// ============================================
// ★ 枠連3人気の買い目抽出
// ============================================
const WAKU3_CONFIG = {
    minWaku3Odds: 6.0,      // 枠連3人気オッズ下限
    maxWaku3Odds: 11.5,     // 枠連3人気オッズ上限
    minWaku2Odds: 4.6,      // 枠連2人気オッズ下限
    maxWaku2Odds: 9.9,      // 枠連2人気オッズ上限
    minUmatanOdds: 16.0,    // 馬単オッズ下限
    maxUmatanRank: 50,      // 馬単人気上限（50人気まで）
    allowedUraRanks: [2, 3, 4, 5, 6, 7] // ★ 追加：裏人気が2〜7の時
};

function extractWaku3Buy(wakuren, umatan, tanfuku) {
    const cfg = WAKU3_CONFIG;

    // 枠連データの確認（2人気・3人気の両方が必要）
    const wr2 = wakuren[1]; // 枠連2人気
    const wr3 = wakuren[2]; // 枠連3人気
    if (!wr2 || !wr3) return "";

    const w2Odds = Number(wr2.odds);
    const w3Odds = Number(wr3.odds);

    // ①-1 枠連3人気のオッズチェック (6.0 - 11.5)
    if (w3Odds < cfg.minWaku3Odds || w3Odds > cfg.maxWaku3Odds) return "";

    // ①-2 枠連2人気のオッズチェック (4.7 - 9.5)
    if (w2Odds < cfg.minWaku2Odds || w2Odds > cfg.maxWaku2Odds) return "";

    // ★ 追加：裏人気のチェック（analyzeWakurenLogic を利用して判定）
    const logicResult = analyzeWakurenLogic(wakuren);
    if (cfg.allowedUraRanks && !cfg.allowedUraRanks.includes(logicResult.uraninki)) {
        return "";
    }

    // ----------------------------------------------------
    // ★ 枠連条件を満たしたため、ここでハイライト登録を実行
    // ----------------------------------------------------
    const pair = wr3.pair;
    window._highlightPairs = window._highlightPairs || [];
    if (!window._highlightPairs.includes(pair)) {
        window._highlightPairs.push(pair);
    }

    // 枠連3人気に対応する枠・馬番リスト作成
    const [wakuA, wakuB] = pair.split("-").map(Number);
    const listA = tanfuku.filter(h => Number(h.waku) === wakuA).map(h => h.num);
    const listB = tanfuku.filter(h => Number(h.waku) === wakuB).map(h => h.num);

    // 枠連3人気に対応した馬番の全ペア（馬単の方向両方）
    const combos = [];
    listA.forEach(a => listB.forEach(b => {
        combos.push(`${a}-${b}`);
        combos.push(`${b}-${a}`);
    }));

    // 単勝人気マッピング（共通除外ルールで使用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 馬単データをオッズ順にソートして「馬単人気順位」を付与
    const sortedUmatan = [...umatan].sort((a, b) => Number(a.odds) - Number(b.odds));
    const umatanRankMap = {};
    sortedUmatan.forEach((u, index) => {

    // 馬単データをオッズ順にソートして「馬単人気順位」を付与
    const sortedUmatan = [...umatan].sort((a, b) => Number(a.odds) - Number(b.odds));
    const umatanRankMap = {};
    sortedUmatan.forEach((u, index) => {
        umatanRankMap[u.pair] = index + 1; // 1人気, 2人気...
    });

    // 単勝人気マッピング（共通除外ルール用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 5) 馬単の抽出と除外判定（1段階目と2段階目の振分け用）
    const hits = umatan
        .filter(u => combos.includes(u.pair))
        .map(u => {
            const uOdds = Number(u.odds);
            const uRank = umatanRankMap[u.pair] || 999; // 馬単人気

            // 除外条件判定（共通除外条件、オッズ下限、人気上限）
            const isExcluded = isCommonExcluded(u.pair, uOdds, winRank) ||
                               (uOdds < NINKI2_5_CONFIG.umatanMinOdds) ||
                               (uRank > NINKI2_5_CONFIG.maxUmatanRank);

            return {
                pair: u.pair,
                odds: u.odds,
                isExcluded: isExcluded
            };
        });

    return hits.length > 0 ? [{ pair, hits }] : [];
}

// ============================================
// ★ 2人気6番目の買い目抽出
// ============================================

const NINKI2_6_CONFIG = {
    waku1OddsRange: { min: 4.2, max: 11.3 }, // 枠連1人気のオッズ範囲
    waku2OddsRange: { min: 6.9, max: 9.5 },  // 枠連2人気のオッズ範囲
    oddsRange: {
        14: [23.0, 29.5],
        15: [27.0, 36.0],
        17: [33.0, 52.5],
        19: [33.0, 68.0],
        22: [70.0, 90.0]
    },
    umatanMinOdds: 50.0,
    maxUmatanRank: 110, // 馬単オッズ人気が110位まで
    allowedUraRanks: [2, 4] // ★ 追加：裏人気が2, 4の時
};

function extractNinki2_6Buy(wakurenResult, umatan, tanfuku) {

    // ★ 裏人気チェック（裏人気が2, 4以外なら除外）
    if (NINKI2_6_CONFIG.allowedUraRanks && !NINKI2_6_CONFIG.allowedUraRanks.includes(wakurenResult.uraninki)) {
        return [];
    }

    // 1) 「2人気6番目」ラベルを持つ行を探す
    const row = wakurenResult.list.find(d =>
        d.logicText.includes("2人気6番目")
    );
    if (!row) return [];

    // 2) 枠連1人気・2人気のオッズチェック
    const wr1 = wakurenResult.list.find(d => Number(d.rank) === 1);
    const wr2 = wakurenResult.list.find(d => Number(d.rank) === 2);
    const w1Odds = wr1 ? Number(wr1.odds) : null;
    const w2Odds = wr2 ? Number(wr2.odds) : null;

    if (w1Odds === null || w1Odds < NINKI2_6_CONFIG.waku1OddsRange.min || w1Odds > NINKI2_6_CONFIG.waku1OddsRange.max) {
        return [];
    }
    if (w2Odds === null || w2Odds < NINKI2_6_CONFIG.waku2OddsRange.min || w2Odds > NINKI2_6_CONFIG.waku2OddsRange.max) {
        return [];
    }

    const ninki = Number(row.rank);
    const odds  = Number(row.odds);
    const pair  = row.pair;

    // 3) 人気ごとの枠連オッズ範囲チェック
    const range = NINKI2_6_CONFIG.oddsRange[ninki];
    if (!range) return [];

    const [minOdds, maxOdds] = range;
    if (odds < minOdds || odds > maxOdds) return [];

    // ----------------------------------------------------
    // ★ 枠連条件を満たしたため、ここでハイライト登録を実行
    // ----------------------------------------------------
    window._highlightPairs = window._highlightPairs || [];
    if (!window._highlightPairs.includes(pair)) {
        window._highlightPairs.push(pair);
    }

    // 4) 枠 → 馬番展開
    const [w1, w2] = pair.split("-").map(Number);
    const list1 = tanfuku.filter(h => Number(h.waku) === w1).map(h => h.num);
    const list2 = tanfuku.filter(h => Number(h.waku) === w2).map(h => h.num);

    const combos = [];
    list1.forEach(a => list2.forEach(b => {
        combos.push(`${a}-${b}`);
        combos.push(`${b}-${a}`);
    }));

    // 馬単データをオッズ順にソートして「馬単人気順位」を付与
    const sortedUmatan = [...umatan].sort((a, b) => Number(a.odds) - Number(b.odds));
    const umatanRankMap = {};
    sortedUmatan.forEach((u, index) => {
        umatanRankMap[u.pair] = index + 1; // 1人気, 2人気...
    });

    // 単勝人気マッピング（共通除外ルール用）
    const winRank = {};
    tanfuku.forEach(h => winRank[h.num] = Number(h.rank));

    // 5) 馬単の抽出と除外判定（1段階目と2段階目の振分け用）
    const hits = umatan
        .filter(u => combos.includes(u.pair))
        .map(u => {
            const uOdds = Number(u.odds);
            const uRank = umatanRankMap[u.pair] || 999; // 馬単人気

            // 除外条件判定（共通除外条件、オッズ下限、人気上限）
            const isExcluded = isCommonExcluded(u.pair, uOdds, winRank) ||
                               (uOdds < NINKI2_6_CONFIG.umatanMinOdds) ||
                               (uRank > NINKI2_6_CONFIG.maxUmatanRank);

            return {
                pair: u.pair,
                odds: u.odds,
                isExcluded: isExcluded
            };
        });

    return hits.length > 0 ? [{ pair, hits }] : [];
}

// --- ロジック層：枠番出現順一覧の算出 ---
// ================================
function calculateOccurrence(data, uraNum, tateNum) {
    let bracketMap = {};
    let appearanceOrder = [];

    // 初期化
    for (let i = 1; i <= 8; i++) bracketMap[i] = [];

    data.forEach(item => {
        const [a, b] = item.pair.split('-').map(Number);

        if (!bracketMap[a].includes(b)) {
            bracketMap[a].push(b);
            if (!appearanceOrder.includes(a)) appearanceOrder.push(a);
        }
        if (a !== b && !bracketMap[b].includes(a)) {
            bracketMap[b].push(a);
            if (!appearanceOrder.includes(b)) appearanceOrder.push(b);
        } else if (a === b && !appearanceOrder.includes(a)) {
            appearanceOrder.push(a);
        }
    });

    // 行のソートロジック
    let sortedBrackets = [];
    if (uraNum) sortedBrackets.push(Number(uraNum));
    if (tateNum && !sortedBrackets.includes(Number(tateNum))) sortedBrackets.push(Number(tateNum));

    appearanceOrder.forEach(n => {
        if (!sortedBrackets.includes(n)) sortedBrackets.push(n);
    });

    return sortedBrackets.map(n => ({
        base: n,
        partners: bracketMap[n]
    }));
}

// ================================
// --- 既存ロジック統合（修正版） ---
// ================================
function calculateTatemePair(fav1, fav2) {
    if (!fav1 || !fav2) return null;
    let n1 = fav1.split('-');
    let n2 = fav2.split('-');
    let common = null;
    for (let i = 0; i < n1.length; i++) {
        let foundIdx = n2.indexOf(n1[i]);
        if (foundIdx !== -1) {
            common = n1[i];
            n1.splice(i, 1);
            n2.splice(foundIdx, 1);
            break;
        }
    }
    if (common) return [n1[0], n2[0]].sort((a, b) => a - b).join('-');
    return null;
}

function calculateUraninki(data, uraNum) {
    if (!uraNum) return 0;
    let count = 0;
    for (let i = 0; i < data.length; i++) {
        if (data[i].pair.split('-').includes(uraNum)) count++;
        else break;
    }
    return count;
}

function analyzeWakurenLogic(data) {
    if (!data || data.length < 2) return { uraNum: '', tateNum: '', tateme: null, uraninki: 0, list: data || [], ref2Partners: [] };
    const fav1Pair = data[0].pair.split('-');
    const fav2Pair = data[1].pair.split('-');
    let uraNum = fav1Pair.find(n => fav2Pair.includes(n));
    let tateNum = fav1Pair.find(n => !fav2Pair.includes(n));
    if (!uraNum) { uraNum = fav1Pair[0]; tateNum = fav1Pair[1]; }
    if (!tateNum) tateNum = (uraNum === fav1Pair[0]) ? fav1Pair[1] : fav1Pair[0];

    const uraninkiCount = calculateUraninki(data, uraNum);
    let ref2Num = fav2Pair.find(n => !fav1Pair.includes(n)) || fav2Pair[0]; 
    const tatemePair = calculateTatemePair(data[0].pair, data[1].pair);

    let counts = { ura: 0, tate: 0, fav2: 0 };
    let ref2Partners = [];

    const list = data.map(item => {
        const nums = item.pair.split('-');
        let labels = [];
        if (nums.includes(tateNum)) { counts.tate++; labels.push(`<span class="logic-tate">縦${counts.tate}</span>`); }
        if (nums.includes(uraNum)) { counts.ura++; labels.push(`<span class="logic-ura">裏${counts.ura}</span>`); }
        
        if (nums.includes(ref2Num)) { 
            counts.fav2++; 
            labels.push(`<span class="logic-fav2">2人気${counts.fav2}番目</span>`); 

            const partner = (nums[0] === ref2Num) ? nums[1] : nums[0];
            ref2Partners.push(partner);
        }
        return { ...item, logicText: labels.join(' '), isTateme: (item.pair === tatemePair) };
    });

    return { 
        uraNum, 
        tateNum, 
        ref2Num, 
        ref2Partners,
        tateme: tatemePair, 
        uraninki: uraninkiCount, 
        list: list 
    };
}

// ================================
// --- パース関数群 ---
// ================================
function parsePairOdds(text, max = 999) {
    if (!text) return [];
    return text.split('\n').map(line => {
        const m = line.match(/(\d+)\s+(\d+[\-]\d+)\s+([\d\.]+)/);
        return m ? { rank: m[1], pair: m[2], odds: m[3] } : null;
    }).filter(x => x).slice(0, max);
}

// ★修正: 無限ループ回避処理を適用
function parseTanshoFukusho(text) {
    if (!text) return [];
    const tokens = text.split(/[\s\n\r]+/).filter(t => t.length > 0);
    let res = [];
    for (let i = 0; i < tokens.length; i++) {
        if (tokens[i+1] && tokens[i+1].startsWith("枠")) {
            let win = "0.0", pMin = 999, pStr = "---";
            const maxLook = Math.min(i + 12, tokens.length);
            for (let j = i + 3; j < maxLook; j++) {
                if (!isNaN(tokens[j]) && !tokens[j].includes("-")) {
                    win = tokens[j];
                    if (tokens[j+1] && tokens[j+2] === "-") {
                        pMin = parseFloat(tokens[j+1]);
                        pStr = tokens[j+1] + "-" + tokens[j+3];
                    }
                    break;
                }
            }
            res.push({ rank: tokens[i], waku: tokens[i+1].replace("枠","").charAt(0), horse: tokens[i+2], win, pMin, pStr, fukuMin: pMin });
        }
    }
    return res;
}

        let tr = document.createElement("tr"); 
        tr.className = row.c;
        tr.innerHTML = `<th class="label-col">${row.l}</th>`;

        data.forEach((d) => {
            let val = [
                d?.rank ?? "",          // 人気
                d?.waku ?? "",          // 枠
                d?.horse ?? d?.num ?? "", // 馬番
                isP ? (d?.pStr ?? "---") : (d?.win ?? "0.0") // オッズ
            ][rIdx];

            let content = (rIdx === 1 && val !== "")
                ? `<img src="waku/${val}.png" alt="${val}" width="18">`
                : val;

            let cls = "";

            // 単勝オッズ（10.0 以下 → 赤）
            if (!isP && rIdx === 3) {
                if (Number(d?.win || 0) <= 10.0) {
                    cls = "odds-red";
                }
            }

            // 複勝オッズ（fukuMin <= 3.0 → 水色）
            if (isP && rIdx === 3) {
                const fMin = d?.fukuMin ?? d?.pMin ?? 999;
                if (Number(fMin) <= 3.0) {
                    cls = "logic-tate";
                } else {
                    cls = "val-place";
                }
            }

            tr.innerHTML += `<td class="${cls}">${content}</td>`;
        });

        t.appendChild(tr);
    });
}

function renderWakurenTable(targetId, result) {
    if (!result || !result.list) return;

    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = '';

    const data = result.list;
    const headLabel = `縦 ${result.tateNum} 裏 ${result.uraNum} (2人気～: ${result.ref2Num})`;

    const highlightPairs = window._highlightPairs || [];

    for (let i = 0; i < data.length; i += 10) {
        const chunk = data.slice(i, i + 10);

        let html = `
        <table class="w-tbl">
            <tr>
                <th>人気</th>
                <th>組番</th>
                <th>オッズ</th>
                <th>${headLabel}</th>
            </tr>`;

        chunk.forEach(d => {
            const rankClass = d.isTateme ? 'class="rank-tateme"' : '';
            const oddsClass = Number(d.odds) <= 10 ? 'odds-red' : '';
            const highlightClass = highlightPairs.includes(d.pair) ? 'highlight-cell' : '';

            html += `
            <tr class="${highlightClass}">
                <td ${rankClass}>${d.rank}</td>
                <td style="background:#fffde7">${d.pair}</td>
                <td class="${oddsClass}">${d.odds}</td>
                <td class="logic-col">${d.logicText}</td>
            </tr>`;
        });

        html += `</table>`;
        target.insertAdjacentHTML('beforeend', html);
    }
}

function isCondChecked(val) {
    const chk = document.querySelector(`.cond[value="${val}"]`);
    return chk ? chk.checked : false;
}

function isCloseOdds(itemA, itemB, maxDiff = 0.3) {
    if (!itemA || !itemB) return false;
    const oddsA = parseFloat(itemA.odds);
    const oddsB = parseFloat(itemB.odds);
    if (isNaN(oddsA) || isNaN(oddsB)) return false;

    return Math.abs(oddsA - oddsB) <= maxDiff;
}

function expandUmatanHits(targetList, cfgSub, wakuOddsList, umatan, tanfuku, umatanRankMap, winRank) {
    let results = [];
    if (!cfgSub || !targetList || !Array.isArray(targetList)) return results;

    targetList.forEach(target => {
        if (!target) return;
        const ninki = Number(target.rank);
        const odds = Number(target.odds);
        const pair = target.pair;

        const range = cfgSub.oddsRange ? cfgSub.oddsRange[ninki] : null;
        if (range) {
            const [minOdds, maxOdds] = range;
            if (odds < minOdds || odds > maxOdds) return;
        }

        const [w1, w2] = pair.split("-").map(Number);
        const list1 = tanfuku.filter(h => Number(h.waku) === w1).map(h => h.num || h.horse);
        const list2 = tanfuku.filter(h => Number(h.waku) === w2).map(h => h.num || h.horse);

        const combos = [];
        list1.forEach(a => {
            list2.forEach(b => {
                if (a === b) return;
                combos.push(`${a}-${b}`);
                combos.push(`${b}-${a}`);
            });
        });

        const hits = umatan.map(u => {
            if (!combos.includes(u.pair)) return null;

            const uOdds = Number(u.odds);
            const uRank = umatanRankMap[u.pair] || 999;
            let isExcluded = false;

            if (typeof isCommonExcluded === "function" && isCommonExcluded(u.pair, uOdds, winRank)) {
                isExcluded = true;
            }
            if (cfgSub.umatanMinOdds && uOdds < cfgSub.umatanMinOdds) {
                isExcluded = true;
            }
            if (cfgSub.maxUmatanRank && uRank > cfgSub.maxUmatanRank) {
                isExcluded = true;
            }

            return {
                pair: u.pair,
                odds: u.odds,
                isExcluded: isExcluded
            };
        }).filter(Boolean);

        if (hits.length > 0) {
            results.push({
                pair: pair,
                hits: hits
            });
        }
    });

    return results;
}

function extractNinkiBuy(wakurenResult, umatan, tanfuku) {
    if (!wakurenResult || !wakurenResult.list) return null;

    const list = wakurenResult.list;
    const sortedUmatan = [...(umatan || [])].sort((a, b) => Number(a.odds) - Number(b.odds));
    const umatanRankMap = {};
    sortedUmatan.forEach((u, index) => { umatanRankMap[u.pair] = index + 1; });
    const winRank = {};
    (tanfuku || []).forEach(h => winRank[h.num || h.horse] = Number(h.rank));

    const r1 = list.find(d => Number(d.rank) === 1);
    const r2 = list.find(d => Number(d.rank) === 2);
    const r3 = list.find(d => Number(d.rank) === 3);

    let targets1_2 = [];
    let targets2_3 = [];

    if (r1) {
        targets1_2.push(r1);
        if (r2 && isCloseOdds(r1, r2, 0.3)) targets1_2.push(r2);
    }

    if (r2) {
        targets2_3.push(r2);
        if (r3 && isCloseOdds(r2, r3, 0.3)) targets2_3.push(r3);
        if (r1 && isCloseOdds(r2, r1, 0.3) && !targets2_3.includes(r1)) targets2_3.push(r1);
    }

    const cfg1_2 = typeof NINKI1_2_CONFIG !== "undefined" ? NINKI1_2_CONFIG : {};
    const cfg2_3 = typeof NINKI2_3_CONFIG !== "undefined" ? NINKI2_3_CONFIG : {};

    return {
        rank1_2: expandUmatanHits(targets1_2, cfg1_2, list, umatan, tanfuku, umatanRankMap, winRank),
        rank2_3: expandUmatanHits(targets2_3, cfg2_3, list, umatan, tanfuku, umatanRankMap, winRank)
    };
}

function extractTateUraBuy(wakurenResult, umatan, tanfuku) {
    if (!wakurenResult || !wakurenResult.list) return null;

    const list = wakurenResult.list;
    const sortedUmatan = [...(umatan || [])].sort((a, b) => Number(a.odds) - Number(b.odds));
    const umatanRankMap = {};
    sortedUmatan.forEach((u, index) => { umatanRankMap[u.pair] = index + 1; });
    const winRank = {};
    (tanfuku || []).forEach(h => winRank[h.num || h.horse] = Number(h.rank));

    const getRow = (label) => list.find(d => d.logicText && d.logicText.includes(label));

    const tate = {
        2: getRow("縦2"), 3: getRow("縦3"), 4: getRow("縦4"),
        5: getRow("縦5"), 6: getRow("縦6"), 7: getRow("縦7")
    };
    const ura = {
        3: getRow("裏3"), 4: getRow("裏4"), 5: getRow("裏5"),
        6: getRow("裏6"), 7: getRow("裏7")
    };

    const getTargetsWithCloseOdds = (dict, mainKey, adjKeys) => {
        let targets = [];
        const mainItem = dict[mainKey];
        if (!mainItem) return targets;

        targets.push(mainItem);
        adjKeys.forEach(adjKey => {
            const adjItem = dict[adjKey];
            if (adjItem && isCloseOdds(mainItem, adjItem, 0.3)) {
                targets.push(adjItem);
            }
        });
        return targets;
    };

    const tateTargets = {
        2: getTargetsWithCloseOdds(tate, 2, [3]),
        3: getTargetsWithCloseOdds(tate, 3, [2, 4]),
        4: getTargetsWithCloseOdds(tate, 4, [3, 5]),
        5: getTargetsWithCloseOdds(tate, 5, [4, 6]),
        6: getTargetsWithCloseOdds(tate, 6, [5, 7]),
        7: getTargetsWithCloseOdds(tate, 7, [6])
    };

    const uraTargets = {
        3: getTargetsWithCloseOdds(ura, 3, [4]),
        4: getTargetsWithCloseOdds(ura, 4, [3, 5]),
        5: getTargetsWithCloseOdds(ura, 5, [4, 6]),
        6: getTargetsWithCloseOdds(ura, 6, [5, 7]),
        7: getTargetsWithCloseOdds(ura, 7, [6])
    };

    const getCfg = (prefix, num) => {
        const globalName = `${prefix.toUpperCase()}${num}_CONFIG`;
        return typeof window[globalName] !== "undefined" ? window[globalName] : {};
    };

    let results = { tate: {}, ura: {} };

    [2, 3, 4, 5, 6, 7].forEach(n => {
        results.tate[n] = expandUmatanHits(tateTargets[n], getCfg("tate", n), list, umatan, tanfuku, umatanRankMap, winRank);
    });

    [3, 4, 5, 6, 7].forEach(n => {
        results.ura[n] = expandUmatanHits(uraTargets[n], getCfg("ura", n), list, umatan, tanfuku, umatanRankMap, winRank);
    });

    return results;
}

function extractBuy() {
    if (!window._wakurenResult) {
        alert("解析結果がありません。先に『解析』を実行してください。");
        return;
    }

    window._highlightPairs = [];

    const addHighlight = (pair) => {
        if (pair && !window._highlightPairs.includes(pair)) {
            window._highlightPairs.push(pair);
        }
    };

    const wakurenResult = window._wakurenResult;
    const wakuren = window._wakuren || [];
    const umatan = window._umatan || [];
    const tanfuku = window._tanfuku || [];

    const buyResultEl = document.getElementById("buyResult");
    const buyCountEl = document.getElementById("buyCount");
    const buyResultAreaEl = document.getElementById("buyResultArea");

    if (buyResultEl) buyResultEl.innerHTML = "";
    if (buyCountEl) buyCountEl.innerText = "";

    if (typeof isRaceOmitted === "function" && isRaceOmitted(wakuren)) {
        if (buyResultEl) {
            buyResultEl.innerHTML = `<span style="color:red; font-weight:bold; font-size:18px;">見送り</span>`;
        }
        if (buyCountEl) buyCountEl.innerText = "";
        if (buyResultAreaEl) buyResultAreaEl.classList.remove("hidden");
        return;
    }

    let validResultHtml = "";
    let totalResultHtml = "";

    const processBuyResult = (labelTitle, subTitle, items, defaultPair = "") => {
        if (!items) return;
        const itemList = Array.isArray(items) ? items : [items];

        itemList.forEach(d => {
            if (!d) return;

            if (typeof d === "object" && d.hits && Array.isArray(d.hits)) {
                const pairStr = d.pair || defaultPair;
                if (pairStr) addHighlight(pairStr);

                let validHitsText = [];
                let totalHitsText = [];

                d.hits.forEach(h => {
                    const itemStr = `${h.pair} (${h.odds})`;
                    if (h.isExcluded) {
                        totalHitsText.push(`<span style="color:green; font-weight:bold;">${itemStr}</span>`);
                    } else {
                        validHitsText.push(itemStr);
                        totalHitsText.push(itemStr);
                    }
                });

                const headerSub = subTitle ? `${subTitle} ` : "";

                if (validHitsText.length > 0) {
                    validResultHtml += `【${labelTitle}】<br>`;
                    if (pairStr) validResultHtml += `${headerSub}<span style="color:blue; font-weight:bold;">${pairStr}</span><br>`;
                    validResultHtml += validHitsText.join(" ") + "<br><br>";
                }

                if (totalHitsText.length > 0) {
                    totalResultHtml += `【${labelTitle}】<br>`;
                    if (pairStr) totalResultHtml += `${headerSub}<span style="color:blue; font-weight:bold;">${pairStr}</span><br>`;
                    totalResultHtml += totalHitsText.join(" ") + "<br><br>";
                }
            } 
            else {
                const pairStr = defaultPair || (typeof d === "object" ? d.pair : "");
                if (pairStr) addHighlight(pairStr);

                const textContent = Array.isArray(d) ? d.join(" ") : (typeof d === "string" ? d : d.text || "");
                if (!textContent) return;

                const headerSub = subTitle ? `${subTitle} ` : "";
                const blockHtml = `【${labelTitle}】<br>${headerSub}${pairStr ? `<span style="color:blue; font-weight:bold;">${pairStr}</span><br>` : ""}${textContent}<br><br>`;

                validResultHtml += blockHtml;
                totalResultHtml += blockHtml;
            }
        });
    };

    // 各条件判定＆処理実行
    if (isCondChecked("waku1") && typeof extractWaku1Buy === "function") {
        const w1 = extractWaku1Buy(wakuren, umatan, tanfuku);
        const pair1 = wakuren[0] ? wakuren[0].pair : "";

    if (isCondChecked("waku2") && typeof extractWaku2Buy === "function") {

    }

    if (isCondChecked("waku3") && typeof extractWaku3Buy === "function") {
        const w3 = extractWaku3Buy(wakuren, umatan, tanfuku);
        const pair3 = wakuren[2] ? wakuren[2].pair : "";
        if (w3) processBuyResult("枠連3人気", "", w3, pair3);
    }

    if (isCondChecked("tate2") && typeof extractTate2Buy === "function") {
        const t2 = extractTate2Buy(wakurenResult, umatan, tanfuku);
        const row2 = wakurenResult.list ? wakurenResult.list.find(d => d.logicText && d.logicText.includes("縦2")) : null;

            processBuyResult("縦裏4番目", "縦4番目", t4.tate);
            processBuyResult("縦裏4番目", "裏4番目", t4.ura);
        }
    }

    if (isCondChecked("tateura5") && typeof extractTateUra5Buy === "function") {

        if (t5) {
            processBuyResult("縦裏5番目", "縦5番目", t5.tate);
            processBuyResult("縦裏5番目", "裏5番目", t5.ura);
        }

    if (isCondChecked("tateura7") && typeof extractTateUra7Buy === "function") {

        if (t7) {
            processBuyResult("縦裏7番目", "縦7番目", t7.tate);
            processBuyResult("縦裏7番目", "裏7番目", t7.ura);
        }

    if (isCondChecked("ninki2_3") && typeof extractNinki2_3Buy === "function") {
        const n23 = extractNinki2_3Buy(wakurenResult, umatan, tanfuku);
        const row23 = wakurenResult.list ? wakurenResult.list.find(d => d.logicText && d.logicText.includes("2人気3")) : null;
        if (n23) processBuyResult("2人気3番目", "", n23, row23 ? row23.pair : "");
    }

    if (isCondChecked("ninki2_4") && typeof extractNinki2_4Buy === "function") {
        const n24 = extractNinki2_4Buy(wakurenResult, umatan, tanfuku);
        const row24 = wakurenResult.list ? wakurenResult.list.find(d => d.logicText && d.logicText.includes("2人気4")) : null;

    if (isCondChecked("ninki2_5") && typeof extractNinki2_5Buy === "function") {

    const validCount = [...validResultHtml.matchAll(/\b\d{1,2}-\d{1,2}\b(?=\s*\()/g)].length;

// 共通除外ルールの閾値設定
const COMMON_EXCLUDE_CONFIG = {
    minWinRankBoth: 10  // 単勝人気が両方この値以上（2桁人気同士）なら除外
};

function isCommonExcluded(pair, odds, winRank) {
    const [a, b] = pair.split("-").map(Number);

    // ① 単勝人気が両方2桁（10人気以上）同士の組み合わせは除外
    if (winRank[a] >= COMMON_EXCLUDE_CONFIG.minWinRankBoth && 
        winRank[b] >= COMMON_EXCLUDE_CONFIG.minWinRankBoth) {
        return true;
    }

    return false;
}

function isRaceOmitted(wakuren) {
    if (!wakuren || wakuren.length < 2) return false;

    const pair1 = wakuren[0].pair;
    const pair2 = wakuren[1].pair;

    const isZorome = p => {
        if (!p) return false;
        const [a, b] = p.split("-");
        return a === b;
    };

    return isZorome(pair1) || isZorome(pair2);
}

function renderUmatanTable(targetId, data) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = '';

    const perCol = 60;   // ★ 馬単は60人気ごと
    const maxCols = 4;
    const total = data.length;
    const cols = Math.min(maxCols, Math.ceil(total / perCol));
    
    let allColsHtml = ""; // 全カラムのHTMLを一時保持する変数

    for (let col = 0; col < cols; col++) {
        const start = col * perCol;
        const end = start + perCol;
        const slice = data.slice(start, end);

        if (slice.length === 0) continue;

        let html = `<table class="w-tbl">
            <tr><th>人気</th><th>組番</th><th>オッズ</th></tr>`;

        slice.forEach(d => {
            html += `<tr>
                <td>${d.rank ?? ""}</td>
                <td style="background:#fffde7">${d.pair ?? ""}</td>
                <td>${d.odds ?? ""}</td>
            </tr>`;
        });

        html += `</table>`;
        allColsHtml += html; // ループ内でのDOM反映を避け、文字列として結合
    }
    
    // 最後にまとめてDOMに一度だけ流し込む
    target.innerHTML = allColsHtml;
}

</script>
</body>
</html>
